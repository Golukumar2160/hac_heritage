name: MoSPI Sunday Automated Vigilance & ETL Sync

on:
  schedule:
    # Runs every Sunday at 00:30 UTC (06:00 AM IST)
    - cron: '30 0 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync Mode: auto (1st Sunday retrains, other Sundays incremental), incremental, retrain'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - incremental
          - retrain

jobs:
  weekly-sync:
    name: Scrape, Archive & Sync to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn psycopg2-binary supabase reportlab requests python-dotenv joblib

      - name: Execute Sunday Synchronization Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SYNC_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: |
          python scraper/sync_pipeline.py --mode $SYNC_MODE

      - name: Pipeline Summary & Status
        if: always()
        run: |
          echo "Sunday Sync Job Finished with status: ${{ job.status }}"
