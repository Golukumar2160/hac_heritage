name: BHARAT-DRISHTI Continuous Deployment (CD)

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  docker-delivery:
    name: Build & Publish Container Images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build & Push Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ci_cd/docker/Dockerfile.backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Docker Metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build & Push Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ci_cd/docker/Dockerfile.frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Instant Render Backend Redeploy (Optional Webhook)
        if: ${{ secrets.RENDER_BACKEND_WEBHOOK != '' }}
        run: |
          echo "[*] Triggering Render backend deploy webhook..."
          curl -s -X POST "${{ secrets.RENDER_BACKEND_WEBHOOK }}" || true
          echo "[+] Render backend webhook dispatched."

      - name: Trigger Instant Render Frontend Redeploy (Optional Webhook)
        if: ${{ secrets.RENDER_FRONTEND_WEBHOOK != '' }}
        run: |
          echo "[*] Triggering Render frontend deploy webhook..."
          curl -s -X POST "${{ secrets.RENDER_FRONTEND_WEBHOOK }}" || true
          echo "[+] Render frontend webhook dispatched."

      - name: Deployment Notification
        if: always()
        run: |
          echo "CD Build & Delivery completed with status: ${{ job.status }}"
