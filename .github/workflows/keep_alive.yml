name: 24/7 Render Keep-Alive Ping

on:
  schedule:
    # Runs every 10 minutes to prevent Render free tier from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Render Backend
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Send HTTP Health Ping
        env:
          TARGET_URL: ${{ secrets.RENDER_BACKEND_URL || 'https://bharat-drishti-backend.onrender.com' }}
        run: |
          echo "[*] Sending health check ping to: ${TARGET_URL}/api/health"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${TARGET_URL}/api/health" || true)
          echo "[+] Response status: ${HTTP_STATUS}"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "[OK] Render backend is awake and responding healthy!"
          else
            echo "[!] Ping sent. Server waking up or warming cache."
          fi
