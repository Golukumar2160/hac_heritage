# ==============================================================================
# BHARAT-DRISHTI // Render.com Docker Infrastructure Blueprint
# ==============================================================================
services:
  - type: web
    name: bharat-drishti-backend
    env: docker
    region: singapore
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PASSWORD_SALT
        value: mplads_secure_salt_2026
