# Source copy of .github/workflows/ci.yml
# To activate in GitHub Actions, keep linked or placed in .github/workflows/ci.yml
name: BHARAT-DRISHTI Continuous Integration (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend Tests & Quality Assurance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stage 1 - Run Unit Tests (test_api.py)
        env:
          SECRET_KEY: test-secret-key-ci-environment
          PASSWORD_SALT: test-salt-ci
        run: |
          python -m unittest tests/test_api.py

      - name: Stage 2 - Run Citizen RBAC Security Tests (test_citizen_rbac.py)
        run: |
          python -m unittest tests/test_citizen_rbac.py

      - name: Stage 3 - Run Batch Forensic Lab Tests (test_batch_audit.py)
        run: |
          python tests/test_batch_audit.py

      - name: Stage 4 - Run System Smoke Test (smoke_test.py)
        run: |
          python tests/smoke_test.py

  frontend-ci:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm install

      - name: Verify Frontend Production Compilation
        working-directory: ./frontend
        run: |
          npm run build
