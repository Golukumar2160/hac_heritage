# Source copy of .github/workflows/ci.yml
# To activate in GitHub Actions, keep linked or placed in .github/workflows/ci.yml
name: BHARAT-DRISHTI Continuous Integration (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend Tests & Quality Assurance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI Background Service
        env:
          PASSWORD_SALT: mplads_secure_salt_2026
          SECRET_KEY: mplads_bharat_drishti_jwt_prod_key_2026_sih_mospi
          SUPABASE_URL: https://gpjfxbvuzfshaxwkcnsx.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_2bbfRrygZubqwsXUKBxYkw_AmA9qVyg
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          python scripts/wait_for_server.py

      - name: Stage 1 - Run Unit Tests (test_api.py)
        run: |
          python -m unittest tests/test_api.py

      - name: Stage 2 - Run Citizen RBAC Security Tests (test_citizen_rbac.py)
        env:
          PASSWORD_SALT: mplads_secure_salt_2026
          SECRET_KEY: mplads_bharat_drishti_jwt_prod_key_2026_sih_mospi
        run: |
          python -m unittest tests/test_citizen_rbac.py

      - name: Stage 3 - Run Batch Forensic Lab Tests (test_batch_audit.py)
        run: |
          python tests/test_batch_audit.py

      - name: Stage 4 - Run System Smoke Test (smoke_test.py)
        env:
          PASSWORD_SALT: mplads_secure_salt_2026
          SECRET_KEY: mplads_bharat_drishti_jwt_prod_key_2026_sih_mospi
          SUPABASE_URL: https://gpjfxbvuzfshaxwkcnsx.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_2bbfRrygZubqwsXUKBxYkw_AmA9qVyg
        run: |
          python tests/smoke_test.py

      - name: Stage 5 - Run MLflow 30-Day Retraining Pipeline Tests (test_mlflow_pipeline.py)
        run: |
          python -m unittest tests/test_mlflow_pipeline.py

  frontend-ci:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm install

      - name: Verify Frontend Production Compilation
        working-directory: ./frontend
        run: |
          npm run build
